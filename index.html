  <!-- Immediate 301-equivalent client redirect for legacy hash URLs -->
  <script>
    (function() {
      var h = window.location.hash.toLowerCase().replace(/^#\/?/, '').trim();
      var routeMap = {
        'services': '/services',
        'what-we-do': '/services',
        'about': '/about',
        'who-we-are': '/about',
        'contact': '/contact',
        'blog': '/blog',
        'insights': '/blog',
        'industries': '/industries'
      };
      if (routeMap[h]) {
        window.location.replace(routeMap[h]);
      }
    })();
  </script>

  <!-- Minimal Brand Fade Loader Styles (Zero-JS Instant Paint) -->
  <style>
    #initial-loader {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s ease;
    }
    #initial-loader.loader-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .loader-logo {
      height: 38px;
      width: auto;
      display: block;
      animation: maxrPulseFade 1.8s ease-in-out infinite;
    }
    .loader-bar {
      margin-top: 22px;
      width: 96px;
      height: 2px;
      background: #E5EAE8;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .loader-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: #54CFB0;
      border-radius: 999px;
      animation: maxrBarSlide 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes maxrPulseFade {
      0%, 100% {
        opacity: 0.55;
        transform: scale(0.98);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }
    @keyframes maxrBarSlide {
      0% {
        transform: translateX(-100%);
      }
      50% {
        transform: translateX(110%);
      }
      100% {
        transform: translateX(250%);
      }
    }
  </style>
</head>
<body>
  <!-- Minimal Fade Loader with MaxR Logo -->
  <div id="initial-loader" aria-hidden="true">
    <div class="loader-content">
      <img src="/assets/maxr-logo.png" alt="MaxR Technology" class="loader-logo" />
      <div class="loader-bar">
        <div class="loader-bar-fill"></div>
      </div>
    </div>
  </div>

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
  <script>
    // Failsafe: dismiss loader if network stalls or script takes unusually long
    setTimeout(function() {
      var loader = document.getElementById('initial-loader');
      if (loader && !loader.classList.contains('loader-hidden')) {
        loader.classList.add('loader-hidden');
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }
    }, 4500);
  </script>
</body>
