  <!-- Immediate 301-equivalent client redirect for legacy hash URLs -->
  <script>
    (function() {
      var h = window.location.hash.toLowerCase().replace(/^#\/?/, '').trim();
      var routeMap = {
        'services': '/services',
        'what-we-do': '/services',
        'about': '/about',
        'who-we-are': '/about',
        'contact': '/contact',
        'blog': '/blog',
        'insights': '/blog',
        'industries': '/industries'
      };
      if (routeMap[h]) {
        window.location.replace(routeMap[h]);
      }
    })();
  </script>
